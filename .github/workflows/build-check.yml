name: .NET Build Check

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'

    - name: Generate sitemap from lesson catalog
      run: node tools/generate-sitemap.mjs

    - name: Verify committed sitemap matches lesson catalog
      run: git diff --exit-code -- wwwroot/sitemap.xml

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore SE347.csproj

    - name: Build project
      run: dotnet build SE347.csproj --no-restore --configuration Release

    - name: Validate lesson JSON (Storage/LessonTemplate)
      run: dotnet run --project SE347.csproj --no-build --configuration Release -- validate-lessons

    - name: Run tests (tests/SE347.Tests)
      run: dotnet test tests/SE347.Tests --configuration Release
